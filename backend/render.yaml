services:
  - type: web
    name: airguard-backend
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    # El buildCommand copia el frontend dentro del backend antes de arrancar
    # Ajusta "../frontend" si tu repo tiene una estructura diferente
    buildCommand: npm install && cp -r ../frontend ./public 2>/dev/null || echo "Frontend ya en ./public o no existe carpeta ../frontend"
    startCommand: node src/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001

      # ── Base de datos ─────────────────────────────────────────
      # Ingresa manualmente en el dashboard de Render
      - key: MONGODB_URI
        sync: false

      # ── OpenAQ ───────────────────────────────────────────────
      - key: OPENAQ_API_KEY
        sync: false
      - key: OPENAQ_FETCH_INTERVAL_MS
        value: 90000
      - key: OPENAQ_DAILY_LIMIT
        value: 1000

      # ── Panel Admin ───────────────────────────────────────────
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_JWT_SECRET
        generateValue: true

      # ── Alertas por Email (SMTP / Gmail) ──────────────────────
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: ALERT_AQI_THRESHOLD
        value: 100

      # ── Web Push (VAPID) ──────────────────────────────────────
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false

      # ── URLs ──────────────────────────────────────────────────
      # APP_URL: la URL que Render te asigna, ej: https://airguard-backend.onrender.com
      - key: APP_URL
        sync: false
      # FRONTEND_DIR: ruta DENTRO del contenedor donde está index.html
      # Con el buildCommand anterior, el frontend queda en ./public
      - key: FRONTEND_DIR
        value: /opt/render/project/src/public
