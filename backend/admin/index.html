<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AirGuard – Panel de Gestión</title>
<style>
  :root {
    --primary: #1565c0;
    --primary-light: #1e88e5;
    --surface: #ffffff;
    --bg: #f0f4f8;
    --border: #cfd8e3;
    --text: #1a2b3c;
    --muted: #5a7a9a;
    --green: #2e7d32;
    --red: #c62828;
    --orange: #e65100;
    --radius: 12px;
    --shadow: 0 2px 16px rgba(21,101,192,0.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* LOGIN */
  #login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #e8f4fd 0%, #f0f7ff 100%);
  }
  .login-card {
    background: var(--surface);
    border-radius: 20px;
    padding: 40px 36px;
    box-shadow: 0 8px 40px rgba(21,101,192,0.15);
    width: 100%;
    max-width: 380px;
    text-align: center;
  }
  .login-logo { font-size: 2.5rem; margin-bottom: 8px; }
  .login-title { font-size: 1.3rem; font-weight: 700; color: var(--primary); margin-bottom: 4px; }
  .login-sub { font-size: 0.82rem; color: var(--muted); margin-bottom: 28px; }
  .form-group { text-align: left; margin-bottom: 18px; }
  .form-group label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
  .form-group input {
    width: 100%; padding: 11px 14px; border: 1.5px solid var(--border);
    border-radius: 10px; font-size: 0.9rem; color: var(--text);
    outline: none; transition: border-color 0.2s;
  }
  .form-group input:focus { border-color: var(--primary-light); }
  .btn-primary {
    width: 100%; padding: 12px; background: var(--primary);
    color: #fff; border: none; border-radius: 10px;
    font-size: 0.95rem; font-weight: 600; cursor: pointer;
    transition: background 0.2s; margin-top: 4px;
  }
  .btn-primary:hover { background: var(--primary-light); }
  .btn-primary:disabled { background: #90a4ae; cursor: not-allowed; }
  .login-error {
    margin-top: 14px; padding: 10px 14px;
    background: #ffebee; border: 1px solid #ef9a9a;
    border-radius: 8px; font-size: 0.82rem; color: var(--red);
    display: none;
  }
  .login-error.show { display: block; }

  /* PANEL */
  #panel-screen { display: none; }
  header {
    background: var(--primary);
    color: #fff;
    padding: 0 24px;
    height: 58px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  .header-brand { font-weight: 700; font-size: 1rem; display: flex; align-items: center; gap: 8px; }
  .header-actions { display: flex; align-items: center; gap: 12px; }
  .session-info { font-size: 0.75rem; opacity: 0.8; }
  .btn-logout {
    padding: 6px 14px; background: rgba(255,255,255,0.2);
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 8px; color: #fff; font-size: 0.8rem;
    cursor: pointer; transition: background 0.2s;
  }
  .btn-logout:hover { background: rgba(255,255,255,0.3); }

  .panel-content { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }

  /* STATS BAR */
  .stats-bar {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 16px 20px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
  }
  .stat-card .stat-val { font-size: 1.8rem; font-weight: 800; color: var(--primary); }
  .stat-card .stat-lbl { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; margin-top: 2px; }

  /* TOOLBAR */
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .toolbar-title { font-size: 1rem; font-weight: 700; }
  .btn-add {
    padding: 9px 18px; background: var(--primary); color: #fff;
    border: none; border-radius: 10px; font-size: 0.85rem;
    font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px;
    transition: background 0.2s;
  }
  .btn-add:hover { background: var(--primary-light); }

  /* TABLE */
  .table-card {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    background: #e8f0fb;
    padding: 12px 16px;
    text-align: left;
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
  }
  tbody tr { border-bottom: 1px solid #f0f4f8; transition: background 0.15s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #f5f9ff; }
  td { padding: 13px 16px; font-size: 0.85rem; vertical-align: middle; }
  .badge {
    display: inline-block; padding: 3px 10px; border-radius: 20px;
    font-size: 0.72rem; font-weight: 600;
  }
  .badge-active   { background: #e8f5e9; color: #2e7d32; }
  .badge-inactive { background: #fce4ec; color: #c62828; }
  .coord-text { font-family: monospace; font-size: 0.8rem; color: var(--muted); }
  .actions { display: flex; gap: 8px; }
  .btn-edit, .btn-delete, .btn-toggle {
    padding: 5px 12px; border: none; border-radius: 7px;
    font-size: 0.75rem; font-weight: 600; cursor: pointer;
    transition: opacity 0.2s;
  }
  .btn-edit   { background: #e3f2fd; color: #1565c0; }
  .btn-toggle { background: #fff3e0; color: #e65100; }
  .btn-delete { background: #ffebee; color: #c62828; }
  .btn-edit:hover, .btn-toggle:hover, .btn-delete:hover { opacity: 0.75; }
  .empty-row td { text-align: center; padding: 40px; color: var(--muted); font-size: 0.9rem; }

  /* MODAL */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.4);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000; padding: 16px;
    display: none;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border-radius: 16px;
    padding: 28px 28px 24px;
    width: 100%; max-width: 500px;
    box-shadow: 0 12px 48px rgba(0,0,0,0.2);
    max-height: 90vh; overflow-y: auto;
  }
  .modal h3 { font-size: 1.1rem; font-weight: 700; margin-bottom: 20px; color: var(--primary); }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .modal .form-group input,
  .modal .form-group select,
  .modal .form-group textarea {
    width: 100%; padding: 10px 12px; border: 1.5px solid var(--border);
    border-radius: 9px; font-size: 0.88rem; color: var(--text);
    outline: none; transition: border-color 0.2s;
    font-family: inherit;
  }
  .modal .form-group input:focus,
  .modal .form-group select:focus { border-color: var(--primary-light); }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }
  .btn-cancel {
    padding: 9px 20px; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 9px;
    font-size: 0.88rem; cursor: pointer;
  }
  .btn-save {
    padding: 9px 24px; background: var(--primary); color: #fff;
    border: none; border-radius: 9px; font-size: 0.88rem;
    font-weight: 600; cursor: pointer;
  }
  .btn-save:hover { background: var(--primary-light); }

  /* MAP PREVIEW */
  #map-preview { height: 200px; border-radius: 10px; margin-top: 8px; border: 1px solid var(--border); }

  /* TOAST */
  .toast {
    position: fixed; bottom: 24px; right: 24px;
    padding: 12px 20px; border-radius: 10px;
    font-size: 0.88rem; font-weight: 500;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    transform: translateY(80px); opacity: 0;
    transition: all 0.3s ease; z-index: 2000;
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.success { background: #1b5e20; color: #fff; }
  .toast.error   { background: #b71c1c; color: #fff; }

  @media(max-width:640px) {
    .form-row { grid-template-columns: 1fr; }
    table { font-size: 0.78rem; }
    td, th { padding: 10px 10px; }
  }
</style>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

<!-- ── LOGIN ── -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">🌿</div>
    <div class="login-title">AirGuard</div>
    <div class="login-sub">Panel de Gestión de Estaciones</div>
    <div class="form-group">
      <label>Contraseña de administrador</label>
      <input type="password" id="login-pass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"/>
    </div>
    <button class="btn-primary" id="login-btn" onclick="doLogin()">Ingresar</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- ── PANEL ── -->
<div id="panel-screen">
  <header>
    <div class="header-brand">
      🌿 AirGuard — Panel de Gestión
    </div>
    <div class="header-actions">
      <span class="session-info" id="session-info">Sesión activa</span>
      <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
    </div>
  </header>

  <div class="panel-content">

    <!-- Stats -->
    <div class="stats-bar">
      <div class="stat-card">
        <div class="stat-val" id="stat-total">–</div>
        <div class="stat-lbl">Estaciones totales</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="stat-active" style="color:#2e7d32">–</div>
        <div class="stat-lbl">Activas</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="stat-inactive" style="color:#c62828">–</div>
        <div class="stat-lbl">Inactivas</div>
      </div>
    </div>

    <!-- Tabla -->
    <div class="toolbar">
      <div class="toolbar-title">📡 Estaciones de Monitoreo</div>
      <button class="btn-add" onclick="openModal()">+ Nueva Estación</button>
    </div>

    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Zona</th>
            <th>Coordenadas</th>
            <th>OpenAQ ID</th>
            <th>Umbral</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="stations-tbody">
          <tr class="empty-row"><td colspan="7">Cargando estaciones...</td></tr>
        </tbody>
      </table>
    </div>

  </div>
</div>

<!-- ── MODAL EDITAR / CREAR ── -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3 id="modal-title">Nueva Estación</h3>
    <input type="hidden" id="station-id"/>
    <div class="form-group">
      <label>Nombre de la estación *</label>
      <input type="text" id="f-name" placeholder="Ej: Centro Histórico"/>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Latitud *</label>
        <input type="number" id="f-lat" step="0.000001" placeholder="13.6942" oninput="updateMapPin()"/>
      </div>
      <div class="form-group">
        <label>Longitud *</label>
        <input type="number" id="f-lng" step="0.000001" placeholder="-89.2219" oninput="updateMapPin()"/>
      </div>
    </div>
    <!-- Mini mapa para confirmar coordenadas -->
    <div id="map-preview"></div>
    <br/>
    <div class="form-row">
      <div class="form-group">
        <label>Zona</label>
        <input type="text" id="f-zone" placeholder="Ej: Norte, Centro, Sur"/>
      </div>
      <div class="form-group">
        <label>OpenAQ ID</label>
        <input type="text" id="f-openaq" placeholder="Ej: 123456"/>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Umbral de alerta (ICA)</label>
        <input type="number" id="f-threshold" placeholder="100" min="0" max="500"/>
      </div>
      <div class="form-group">
        <label>Estado</label>
        <select id="f-active">
          <option value="true">Activa</option>
          <option value="false">Inactiva</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>Descripción</label>
      <textarea id="f-desc" rows="2" placeholder="Descripción opcional de la estación..." style="resize:vertical"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-save" onclick="saveStation()">Guardar</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ════════════════════════════════════════════════════════
// CONFIG
// ════════════════════════════════════════════════════════
const API = '/api/admin';
let authToken = sessionStorage.getItem('airguard_token') || null;
let stations  = [];
let miniMap   = null;
let miniMarker = null;

// ════════════════════════════════════════════════════════
// AUTH
// ════════════════════════════════════════════════════════
async function doLogin() {
  const pass = document.getElementById('login-pass').value.trim();
  const btn  = document.getElementById('login-btn');
  const err  = document.getElementById('login-error');
  if (!pass) return;

  btn.disabled = true;
  btn.textContent = 'Verificando...';
  err.classList.remove('show');

  try {
    const res  = await fetch(`${API}/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pass }),
    });
    const data = await res.json();

    if (!res.ok) {
      err.textContent = data.error || 'Error de autenticación.';
      err.classList.add('show');
      return;
    }

    authToken = data.token;
    sessionStorage.setItem('airguard_token', authToken);
    showPanel();
  } catch(e) {
    err.textContent = 'No se pudo conectar con el servidor.';
    err.classList.add('show');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Ingresar';
  }
}

function logout() {
  authToken = null;
  sessionStorage.removeItem('airguard_token');
  document.getElementById('panel-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('login-pass').value = '';
}

// ════════════════════════════════════════════════════════
// PANEL
// ════════════════════════════════════════════════════════
async function showPanel() {
  document.getElementById('login-screen').style.display  = 'none';
  document.getElementById('panel-screen').style.display = 'block';

  // Calcular tiempo restante de sesión (JWT dura 8h)
  try {
    const payload = JSON.parse(atob(authToken.split('.')[1]));
    const expDate = new Date(payload.exp * 1000);
    document.getElementById('session-info').textContent =
      `Sesión válida hasta las ${expDate.toLocaleTimeString('es-SV',{hour:'2-digit',minute:'2-digit'})}`;
  } catch(_) {}

  await loadStations();
}

async function loadStations() {
  try {
    const res  = await fetch(`${API}/stations`, {
      headers: { Authorization: `Bearer ${authToken}` },
    });
    if (res.status === 401) { logout(); return; }
    const data = await res.json();
    stations = data.data || [];
    renderTable();
    updateStats();
  } catch(e) {
    toast('Error cargando estaciones: ' + e.message, 'error');
  }
}

function updateStats() {
  const active = stations.filter(s => s.is_active !== false).length;
  document.getElementById('stat-total').textContent    = stations.length;
  document.getElementById('stat-active').textContent   = active;
  document.getElementById('stat-inactive').textContent = stations.length - active;
}

function renderTable() {
  const tbody = document.getElementById('stations-tbody');
  if (!stations.length) {
    tbody.innerHTML = '<tr class="empty-row"><td colspan="7">No hay estaciones registradas. Agrega la primera.</td></tr>';
    return;
  }

  tbody.innerHTML = stations.map(s => `
    <tr>
      <td><strong>${s.name}</strong></td>
      <td>${s.zone || '–'}</td>
      <td class="coord-text">${s.coordinates?.lat?.toFixed(5) || '–'}, ${s.coordinates?.lng?.toFixed(5) || '–'}</td>
      <td class="coord-text">${s.openaq_id || '–'}</td>
      <td>${s.alert_threshold ?? 100} ICA</td>
      <td><span class="badge ${s.is_active !== false ? 'badge-active' : 'badge-inactive'}">${s.is_active !== false ? 'Activa' : 'Inactiva'}</span></td>
      <td>
        <div class="actions">
          <button class="btn-edit"   onclick="editStation('${s._id}')">Editar</button>
          <button class="btn-toggle" onclick="toggleStation('${s._id}', ${s.is_active !== false})">${s.is_active !== false ? 'Desactivar' : 'Activar'}</button>
          <button class="btn-delete" onclick="deleteStation('${s._id}', '${s.name}')">Eliminar</button>
        </div>
      </td>
    </tr>`).join('');
}

// ════════════════════════════════════════════════════════
// MODAL
// ════════════════════════════════════════════════════════
function openModal(station = null) {
  document.getElementById('modal-title').textContent = station ? 'Editar Estación' : 'Nueva Estación';
  document.getElementById('station-id').value  = station?._id || '';
  document.getElementById('f-name').value      = station?.name || '';
  document.getElementById('f-lat').value       = station?.coordinates?.lat || '';
  document.getElementById('f-lng').value       = station?.coordinates?.lng || '';
  document.getElementById('f-zone').value      = station?.zone || '';
  document.getElementById('f-openaq').value    = station?.openaq_id || '';
  document.getElementById('f-threshold').value = station?.alert_threshold ?? 100;
  document.getElementById('f-active').value    = String(station?.is_active !== false);
  document.getElementById('f-desc').value      = station?.description || '';
  document.getElementById('modal').classList.add('open');

  // Inicializar mini mapa
  setTimeout(() => {
    const lat = station?.coordinates?.lat || 13.692;
    const lng = station?.coordinates?.lng || -89.218;
    if (!miniMap) {
      miniMap = L.map('map-preview', { center: [lat, lng], zoom: 13, zoomControl: true });
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(miniMap);
      miniMap.on('click', (e) => {
        document.getElementById('f-lat').value = e.latlng.lat.toFixed(6);
        document.getElementById('f-lng').value = e.latlng.lng.toFixed(6);
        updateMapPin();
      });
    } else {
      miniMap.setView([lat, lng], 13);
    }
    miniMarker = L.marker([lat, lng], { draggable: true }).addTo(miniMap);
    miniMarker.on('dragend', (e) => {
      const pos = e.target.getLatLng();
      document.getElementById('f-lat').value = pos.lat.toFixed(6);
      document.getElementById('f-lng').value = pos.lng.toFixed(6);
    });
    miniMap.invalidateSize();
  }, 150);
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  if (miniMarker) { miniMarker.remove(); miniMarker = null; }
}

function updateMapPin() {
  const lat = parseFloat(document.getElementById('f-lat').value);
  const lng = parseFloat(document.getElementById('f-lng').value);
  if (miniMap && !isNaN(lat) && !isNaN(lng)) {
    if (miniMarker) miniMarker.remove();
    miniMarker = L.marker([lat, lng], { draggable: true }).addTo(miniMap);
    miniMarker.on('dragend', (e) => {
      const pos = e.target.getLatLng();
      document.getElementById('f-lat').value = pos.lat.toFixed(6);
      document.getElementById('f-lng').value = pos.lng.toFixed(6);
    });
    miniMap.setView([lat, lng], 14);
  }
}

// ════════════════════════════════════════════════════════
// CRUD
// ════════════════════════════════════════════════════════
async function saveStation() {
  const id   = document.getElementById('station-id').value;
  const name = document.getElementById('f-name').value.trim();
  const lat  = parseFloat(document.getElementById('f-lat').value);
  const lng  = parseFloat(document.getElementById('f-lng').value);

  if (!name)         return toast('El nombre es requerido.', 'error');
  if (isNaN(lat) || isNaN(lng)) return toast('Coordenadas inválidas.', 'error');

  const body = {
    name,
    coordinates:     { lat, lng },
    zone:            document.getElementById('f-zone').value.trim(),
    openaq_id:       document.getElementById('f-openaq').value.trim(),
    alert_threshold: parseInt(document.getElementById('f-threshold').value) || 100,
    is_active:       document.getElementById('f-active').value === 'true',
    description:     document.getElementById('f-desc').value.trim(),
  };

  const isEdit = Boolean(id);
  const url    = isEdit ? `${API}/stations/${id}` : `${API}/stations`;
  const method = isEdit ? 'PUT' : 'POST';

  try {
    const res  = await fetch(url, {
      method,
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${authToken}` },
      body: JSON.stringify(body),
    });
    if (res.status === 401) { logout(); return; }
    const data = await res.json();
    if (!res.ok) return toast(data.error || 'Error al guardar.', 'error');
    closeModal();
    toast(isEdit ? '✅ Estación actualizada.' : '✅ Estación creada.', 'success');
    await loadStations();
  } catch(e) {
    toast('Error de conexión: ' + e.message, 'error');
  }
}

function editStation(id) {
  const s = stations.find(s => s._id === id);
  if (s) openModal(s);
}

async function toggleStation(id, currentlyActive) {
  try {
    const res = await fetch(`${API}/stations/${id}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${authToken}` },
      body: JSON.stringify({ is_active: !currentlyActive }),
    });
    if (res.status === 401) { logout(); return; }
    toast(`✅ Estación ${currentlyActive ? 'desactivada' : 'activada'}.`, 'success');
    await loadStations();
  } catch(e) {
    toast('Error: ' + e.message, 'error');
  }
}

async function deleteStation(id, name) {
  if (!confirm(`¿Eliminar la estación "${name}"? Esta acción no se puede deshacer.`)) return;
  try {
    const res = await fetch(`${API}/stations/${id}`, {
      method: 'DELETE',
      headers: { Authorization: `Bearer ${authToken}` },
    });
    if (res.status === 401) { logout(); return; }
    toast(`✅ Estación "${name}" eliminada.`, 'success');
    await loadStations();
  } catch(e) {
    toast('Error: ' + e.message, 'error');
  }
}

// ════════════════════════════════════════════════════════
// TOAST
// ════════════════════════════════════════════════════════
function toast(msg, type = 'success') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className   = `toast ${type} show`;
  setTimeout(() => el.classList.remove('show'), 3500);
}

// ════════════════════════════════════════════════════════
// INIT — si ya hay token en sessionStorage, ir directo al panel
// ════════════════════════════════════════════════════════
if (authToken) {
  showPanel();
} else {
  document.getElementById('panel-screen').style.display = 'none';
}

// Cerrar modal al hacer click fuera
document.getElementById('modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});
</script>
